<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ĀTMĀYÂ — Yoga & Therapy Studio</title>
  <script src="users.js"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      /* quando ha espaco os elementos centram-se; quando a pagina
         e mais alta que o ecra nada fica cortado fora do scroll */
      padding-bottom: 0;
      background-color: #f7f5f0;
      background-image: url('logo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(247, 245, 240, 0.85);
      z-index: -1;
    }

    header { text-align: center; margin-bottom: 1.8rem; padding: 1rem; margin-top: auto; }

    header img {
      width: 130px;
      max-width: 60vw;
      margin-bottom: 1rem;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
    }

    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: 0.15em; color: #1a1a1a; }
    h1 span { color: #8a6d3b; }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6b6257;
    }

    /* ---------- Login ---------- */
    #login-box {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d8cfc0;
      border-radius: 14px;
      padding: 2rem 2.2rem;
      width: min(92vw, 360px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }

    #login-box h2 { font-size: 1.1rem; letter-spacing: 0.12em; margin-bottom: 1.2rem; text-align: center; color: #2b2b2b; }

    #login-box label { display: block; font-size: 0.85rem; color: #6b6257; margin: 0.6rem 0 0.2rem; }

    #login-box input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid #cfc5b4;
      border-radius: 8px;
      background: #fffdf8;
      font-size: 1rem;
    }

    #login-box button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.7rem;
      background: #1a1a1a;
      color: #f7f5f0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    #login-box button:hover { background: #8a6d3b; }

    #login-error {
      margin-top: 0.8rem;
      color: #a33;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    /* ---------- Aplicações ---------- */
    #apps-box { display: none; width: 100%; }

    #welcome {
      text-align: center;
      font-size: 1rem;
      color: #514a41;
      margin-bottom: 1rem;
    }

    #welcome strong { color: #8a6d3b; }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 300px));
      gap: 1.2rem;
      justify-content: center;
      padding: 0 1rem 1.5rem;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 1.6rem 1.2rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d8cfc0;
      border-radius: 14px;
      text-decoration: none;
      color: #2b2b2b;
      font-size: 1.05rem;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    nav a:hover, nav a:focus {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      border-color: #8a6d3b;
      outline: none;
    }

    nav a .icon { font-size: 1.6rem; }
    nav a .desc { font-size: 0.82rem; color: #77705f; }

    .bar { text-align: center; margin: 0.5rem 0 1.5rem; }

    .bar button {
      background: none;
      border: 1px solid #b9ad97;
      border-radius: 8px;
      padding: 0.45rem 1.1rem;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: #514a41;
      cursor: pointer;
      margin: 0 0.3rem;
    }

    .bar button:hover { border-color: #8a6d3b; color: #8a6d3b; }

    footer {
      margin-top: 1rem;
      margin-bottom: auto;
      padding: 0 1rem 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      color: #8c8474;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logotipo ĀTMĀYÂ Yoga &amp; Therapy Studio">
    <h1>ĀTMĀYĀ <span>YOGA &amp; THERAPY STUDIO</span></h1>
    <p class="subtitle">Desde 13 Out 25</p>
  </header>

  <!-- Caixa de login -->
  <div id="login-box">
    <h2>ENTRAR</h2>
    <label for="username">Utilizador</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="btn-login">Entrar</button>
    <p id="login-error">Utilizador ou password incorretos.</p>
  </div>

  <!-- Aplicações (visível após login) -->
  <div id="apps-box">
    <p id="welcome"></p>
    <div class="bar">
      <button onclick="logoutAndReload()">Sair</button>
    </div>
    <nav id="apps"></nav>
  </div>

  <footer>Ātmāyā • Yoga &amp; Therapy Studio<br>
    <span style="letter-spacing:0.12em">© 2025–2026 Ātmāyā • Desde 13 Out 25 • v6</span></footer>

  <script>
    function logoutAndReload() { AUTH.logout(); location.reload(); }

    function render() {
      const s = AUTH.session();
      const loginBox = document.getElementById('login-box');
      const appsBox = document.getElementById('apps-box');

      if (!s) { loginBox.style.display = 'block'; appsBox.style.display = 'none'; return; }

      // Sessão ativa: esconder login, mostrar apps permitidas
      loginBox.style.display = 'none';
      appsBox.style.display = 'block';
      document.getElementById('welcome').innerHTML =
        'Bem-vindo(a), <strong>' + escapeHtml(s.name) + '</strong>';

      const nav = document.getElementById('apps');
      nav.innerHTML = '';
      AUTH.APPS.forEach(a => {
        if (s.admin || (s.apps || []).includes(a.id)) {
          const link = document.createElement('a');
          link.href = a.file;
          link.innerHTML =
            '<span class="icon">' + a.icon + '</span>' +
            '<strong>' + escapeHtml(a.name) + '</strong>' +
            '<span class="desc">' + escapeHtml(a.desc || 'Abrir aplicação') + '</span>';
          nav.appendChild(link);
        }
      });

      // Botão de administração
      if (s.admin) {
        const bar = document.querySelector('.bar');
        const adm = document.createElement('a');
        adm.href = 'admin.html';
        adm.style.cssText = 'display:inline-block;margin:0.3rem;padding:0.45rem 1.1rem;border:1px solid #b9ad97;border-radius:8px;text-decoration:none;color:#514a41;font-size:0.9rem;letter-spacing:0.1em;';
        adm.textContent = 'Painel de Administração';
        bar.appendChild(adm);
      }
    }

    function escapeHtml(t) {
      return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('btn-login').addEventListener('click', () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const ok = AUTH.login(u, p);
      document.getElementById('login-error').style.display = ok ? 'none' : 'block';
      if (ok) render();
    });

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });

    render();

    // dados frescos vindos do servidor (Cloudflare): redesenhar
    document.addEventListener('atmaya-data', render);
  </script>

</body>
</html>
